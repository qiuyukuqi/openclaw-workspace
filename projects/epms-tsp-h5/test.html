<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
</head><body style="background:#1e1e2e;margin:0;padding:20px">
<h2 style="color:#cdd6f4">Chart Test</h2>
<div id="chart" style="width:100%;height:300px;background:#313244;border-radius:12px"></div>
<script>
var chart = echarts.init(document.getElementById('chart'));
var data = [];
for(var i=0;i<30;i++){data.push([Date.now()-(30-i)*60000, 50+Math.random()*20]);}
chart.setOption({
  tooltip:{show:true,trigger:'axis',confine:true},
  xAxis:{type:'time'},
  yAxis:{type:'value'},
  series:[{name:'TSP',type:'line',data:data}]
});
</script></body></html>
